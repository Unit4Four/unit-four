<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f1ea;">
  <tr>
    <td align="center" style="padding:32px 16px;">

      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background-color:#ffffff;">

        <tr>
          <td style="background-color:#060605;padding:24px 40px;border-bottom:3px solid #c9a227;font-family:Arial,Helvetica,sans-serif;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#c9a227;">
            New website enquiry
          </td>
        </tr>

        <tr>
          <td style="padding:36px 40px 8px 40px;font-family:Georgia,'Times New Roman',serif;font-size:24px;line-height:1.3;color:#060605;">
            {{business_name}}
          </td>
        </tr>

        <tr>
          <td style="padding:0 40px 24px 40px;font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#777777;">
            Submitted {{submitted_at}}
          </td>
        </tr>

        <tr>
          <td style="padding:0 40px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-top:1px solid #e6dfc9;">

              <tr>
                <td width="140" valign="top" style="padding:16px 0;border-bottom:1px solid #e6dfc9;font-family:Arial,Helvetica,sans-serif;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#8a6d12;">Name</td>
                <td valign="top" style="padding:16px 0;border-bottom:1px solid #e6dfc9;font-family:Arial,Helvetica,sans-serif;font-size:15px;color:#060605;">{{full_name}}</td>
              </tr>

              <tr>
                <td width="140" valign="top" style="padding:16px 0;border-bottom:1px solid #e6dfc9;font-family:Arial,Helvetica,sans-serif;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#8a6d12;">Business</td>
                <td valign="top" style="padding:16px 0;border-bottom:1px solid #e6dfc9;font-family:Arial,Helvetica,sans-serif;font-size:15px;color:#060605;">{{business_name}}</td>
              </tr>

              <tr>
                <td width="140" valign="top" style="padding:16px 0;border-bottom:1px solid #e6dfc9;font-family:Arial,Helvetica,sans-serif;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#8a6d12;">Email</td>
                <td valign="top" style="padding:16px 0;border-bottom:1px solid #e6dfc9;font-family:Arial,Helvetica,sans-serif;font-size:15px;color:#060605;"><a href="mailto:{{email}}" style="color:#060605;">{{email}}</a></td>
              </tr>

              <tr>
                <td width="140" valign="top" style="padding:16px 0;border-bottom:1px solid #e6dfc9;font-family:Arial,Helvetica,sans-serif;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#8a6d12;">Phone</td>
                <td valign="top" style="padding:16px 0;border-bottom:1px solid #e6dfc9;font-family:Arial,Helvetica,sans-serif;font-size:15px;color:#060605;">{{phone}}</td>
              </tr>

              <tr>
                <td width="140" valign="top" style="padding:16px 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#8a6d12;">Message</td>
                <td valign="top" style="padding:16px 0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.7;color:#060605;white-space:pre-wrap;">{{message}}</td>
              </tr>

            </table>
          </td>
        </tr>

        <tr>
          <td style="padding:28px 40px 40px 40px;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.7;color:#777777;">
            Hit reply to respond straight to {{full_name}}. The same submission is saved in the admin dashboard at unitfourgroup.com/admin.
          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>
