<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Unit Four</title>
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23070605'/%3E%3Ctext x='50' y='68' font-family='Georgia' font-size='60' fill='%23c9a227' text-anchor='middle'%3EU%3C/text%3E%3C/svg%3E">

<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<div class="grain"></div>

<!-- ================= LOGIN ================= -->
<section class="admin-login" id="adminLogin">
  <div class="admin-login__box">
    <a href="/index.html" class="admin-login__logo">
      <img src="/assets/logo-horizontal.jpg" alt="Unit Four" class="nav__logo-img">
    </a>
    <h1>Admin Login</h1>
    <form id="loginForm" novalidate>
      <div class="form__group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autocomplete="username">
      </div>
      <div class="form__group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <p class="admin-login__error" id="loginError" hidden>Incorrect username or password.</p>
      <button type="submit" class="contact__btn form__submit">
        <span>Log In</span>
      </button>
    </form>
  </div>
</section>

<!-- ================= DASHBOARD ================= -->
<section class="admin-dashboard" id="adminDashboard" hidden>
  <header class="admin-dashboard__header">
    <a href="/index.html" class="nav__logo">
      <img src="/assets/logo-horizontal.jpg" alt="Unit Four" class="nav__logo-img">
    </a>
    <h1>Contact Submissions</h1>
    <button id="logoutBtn" class="admin-logout">Log Out</button>
  </header>

  <div class="admin-dashboard__body">
    <p class="admin-status" id="adminStatus">Loading submissions...</p>
    <div class="admin-table-wrap">
      <table class="admin-table" id="submissionsTable" hidden>
        <thead>
          <tr>
            <th>Date</th>
            <th>Name</th>
            <th>Business Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Message</th>
          </tr>
        </thead>
        <tbody id="submissionsBody"></tbody>
      </table>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/js/supabase-config.js"></script>
<script src="/admin/admin.js"></script>
</body>
</html>
